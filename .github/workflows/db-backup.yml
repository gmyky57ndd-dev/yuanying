name: Weekly DB Backup

# ES-031: weekly Supabase -> Git snapshot.
# Requires repo secret SUPABASE_DB_URL. Use the IPv4 session pooler
# (aws-<n>-<region>.pooler.supabase.com:5432): GitHub-hosted runners have no IPv6
# and cannot reach db.<ref>.supabase.co.
# The snapshot is uploaded as a workflow artifact, NOT committed: this repo is
# PUBLIC and the dump contains the owner's messages/signals (personal data).
# Artifacts are downloadable by repo admins for 90 days.
# For an off-GitHub copy, use Settings -> 导出我的元婴 (ZIP) or a private repo.

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check backup secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set"
            exit 1
          fi

      - name: Dump Supabase database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backups/db
          DATE=$(date -u +%F)
          # Credential tables are dumped as schema only: the artifact is
          # downloadable by admins, and tokens/keys must never leave the DB
          # (AGENTS.md §5.2.4).
          docker run --rm \
            -e SUPABASE_DB_URL \
            -e BACKUP_DATE="$DATE" \
            -v "$PWD/backups/db:/backups" \
            postgres:17 \
            sh -c 'pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges --clean --if-exists --exclude-table-data=models --exclude-table-data=google_oauth_tokens -f "/backups/${BACKUP_DATE}.sql"'
          sudo chown -R "$(id -u):$(id -g)" backups/db
          echo "BACKUP_DATE=$DATE" >> "$GITHUB_ENV"

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-snapshot-${{ env.BACKUP_DATE }}
          path: backups/db/*.sql
          retention-days: 90
          if-no-files-found: error
