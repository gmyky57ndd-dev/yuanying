name: Daily Evening Summary

# ES-065: Vercel Hobby cannot run a 21:30 cron reliably, so GitHub Actions is the
# trigger. 01:30 UTC = 21:30 EDT (20:30 EST; DST shifts the local time by an hour).
on:
  # ES-075: the primary trigger is Supabase pg_cron (job evening-summary-15m),
  # which is not subject to GitHub's multi-hour schedule delays. This workflow is
  # kept for manual runs only.
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/daily-summary
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL repo secret is not set"
            exit 1
          fi
          curl -fsS -X POST "$APP_URL/api/cron/evening-summary" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H 'Content-Type: application/json' \
            -d '{}' | tee /tmp/resp.json
          # ES-075 DoD: skipped runs are fine; a run that generates must produce a row.
          node -e "const r=require('/tmp/resp.json'); if(!r.ok){console.error('summary failed',r);process.exit(1)} if(r.skipped){console.log('skipped',r.skipped);process.exit(0)} if(!r.message_id){console.error('summary not generated',r);process.exit(1)} console.log('summary ok',r.date,r.message_id)"

