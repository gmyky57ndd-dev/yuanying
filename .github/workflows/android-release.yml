name: Android Release

# Cut a release by pushing a tag like: git tag v1.0.2 && git push origin v1.0.2
# The collector's self-update checks this repo's "latest" release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.0.2)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Write signing config from secrets
        run: |
          mkdir -p keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/yuanying-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=../keystore/yuanying-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Install collector deps
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed release APK + AAB
        run: cd android && ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Determine release tag
        id: tag
        run: echo "tag=${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          AAB=collector/android/app/build/outputs/bundle/release/app-release.aab
          APK=collector/android/app/build/outputs/apk/release/app-release.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$AAB" "$APK" --clobber
          else
            gh release create "$TAG" "$AAB" "$APK" \
              --title "元婴采集器 $TAG" \
              --notes "Signed release build." \
              --latest
          fi

      # Upload to Play once PLAY_SERVICE_ACCOUNT_JSON is configured.
      # NOTE: status must be `completed` (not `draft`) or the internal track
      # never rolls out and testers stay on the last completed version.
      - name: Upload to Google Play (internal)
        if: env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.orbace.yuanying
          releaseFiles: collector/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Skipped Play upload (no PLAY_SERVICE_ACCOUNT_JSON)
        if: env.HAS_PLAY != 'true'
        run: echo "PLAY_SERVICE_ACCOUNT_JSON not set — upload the AAB to Play manually."
