name: Probe Bridge

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: GET page
        run: |
          curl -sS -m 20 -o /dev/null -w "GET / -> %{http_code}\n" https://yuanying-bridge-1.taila5ffe0.ts.net/
      - name: POST login (wrong password, expect 401)
        run: |
          curl -sS -m 20 -X POST https://yuanying-bridge-1.taila5ffe0.ts.net/api/auth/login \
            -H 'Content-Type: application/json' -d '{"password":"probe"}' \
            -o /tmp/out.txt -w "POST login -> %{http_code}\n"
          cat /tmp/out.txt
